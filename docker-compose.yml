name: plex-player

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plex}
      POSTGRES_DB: ${POSTGRES_DB:-plex}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
      # Runs only on a first-time init of an empty db_data volume.
      # Uncomment (and adjust the path) to seed from a SQL dump:
      # - ./dump.sql:/docker-entrypoint-initdb.d/10-dump.sql:ro
    networks:
      - data
    # Not published: only the backend talks to the database.
    # ports:
    #   - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plex} -d ${POSTGRES_DB:-plex}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly keeps sessions and cached responses across a container
    # restart; without it a restart logs every user out.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    networks:
      - data
    # Not published: only the backend talks to Redis.
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-plex}:${POSTGRES_PASSWORD:-plex}@db:5432/${POSTGRES_DB:-plex}
      # Caches Plex responses and serves sessions. Optional: without it the
      # API falls back to Plex directly and to the Postgres session mirror.
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-change-this-to-a-random-secret-in-production}
      # Sessions run over plain HTTP by default; set to true once TLS is in front.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # nginx is the only proxy in front of the backend.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DEFAULT_PLEX_URL: ${DEFAULT_PLEX_URL:-}
      DEFAULT_PLEX_TOKEN: ${DEFAULT_PLEX_TOKEN:-}
      # Starting theme for browsers that have not chosen one: light, dark, or
      # system (the default) to follow the viewer's device.
      DEFAULT_THEME: ${DEFAULT_THEME:-system}
      # Where a future on-disk album art / artist image cache should live.
      MEDIA_CACHE_DIR: /app/cache
    volumes:
      - media_cache:/app/cache
    networks:
      - data
      - web
    # Uncomment to reach the API directly from the host for debugging.
    # ports:
    #   - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
      # required:false — the API starts and serves without Redis, so a Redis
      # that is slow or missing must not hold it back.
      redis:
        condition: service_healthy
        required: false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    networks:
      - web
    depends_on:
      backend:
        condition: service_healthy

networks:
  # frontend <-> backend
  web:
  # backend <-> db and redis (frontend is not attached, so it can reach neither)
  data:

volumes:
  db_data:
  # Cached Plex responses and the fast path for sessions (mirrored in Postgres).
  redis_data:
  # Reserved for caching album art and artist images on disk; mounted at
  # /app/cache in the backend and exposed as MEDIA_CACHE_DIR.
  media_cache:
